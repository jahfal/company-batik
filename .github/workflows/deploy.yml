name: CI Pipeline Batik App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./cms-catalog-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-backend:latest

      # 2. Build & Push Frontend (Next.js) - INI PERBAIKANNYA!
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./company-profile-batik
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-batik.jahfallazuardi.my.id

      # 3. Build & Push CMS Dashboard (React)
      - name: Build and Push CMS
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-cms
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-cms:latest
          build-args: |
            REACT_APP_API_URL=https://api-batik.jahfallazuardi.my.id
            NEXT_PUBLIC_API_URL=https://api-batik.jahfallazuardi.my.id

      - name: Trigger Jenkins Deployment
        if: success()
        run: |
          echo "Menghubungi Jenkins untuk me-refresh semua service Batik App..."
          curl -f -X POST "${{ secrets.JENKINS_URL }}/job/deploy-batik-app/buildWithParameters?token=${{ secrets.JENKINS_TOKEN }}&TARGET_SERVICES=all" \
            -u "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}"