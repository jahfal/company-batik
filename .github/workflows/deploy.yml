name: CI Pipeline Batik App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build & Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./cms-catalog-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-backend:latest

      # 2. Build & Push Frontend (Next.js)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./company-profile-batik
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-batik.jahfallazuardi.my.id

      # 3. Build & Push CMS Dashboard (React)
      - name: Build and Push CMS
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard-cms
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/company-batik-cms:latest
          build-args: |
            REACT_APP_API_URL=https://api-batik.jahfallazuardi.my.id
            NEXT_PUBLIC_API_URL=https://api-batik.jahfallazuardi.my.id

      # 4. Trigger Jenkins (dengan CSRF Crumb & Cookie)
      # Koneksikan runner ke Tailscale via OAuth
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Trigger Jenkins Deployment
        if: success()
        run: |
          echo "Fetching CSRF crumb..."
          CRUMB_VALUE=$(curl -s -u "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --cookie-jar /tmp/cookies.txt \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | grep -o '"crumb":"[^"]*"' | cut -d'"' -f4)

          if [ -z "$CRUMB_VALUE" ]; then
            echo "Error: Failed to retrieve Jenkins crumb"
            exit 1
          fi

          echo "Triggering remote build for all target services..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.JENKINS_URL }}/job/deploy-batik-app/buildWithParameters?token=${{ secrets.JENKINS_TOKEN }}&TARGET_SERVICES=all" \
            --user "${{ secrets.JENKINS_USERNAME }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --cookie /tmp/cookies.txt \
            -H "Jenkins-Crumb: $CRUMB_VALUE")

          echo "Jenkins Response Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Error: Jenkins returned status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Build triggered successfully! Check Jenkins dashboard."