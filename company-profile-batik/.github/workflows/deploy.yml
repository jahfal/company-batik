name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Ganti 'main' atau 'master' sesuai branch kamu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env file for Build
      run: |
        echo "NEXT_PUBLIC_API_URL=http://192.168.1.53/api" > .env
        
        echo "PORT=3001" >> .env
        
        cat .env

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/company-profile-batik:latest