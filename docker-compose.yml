services:
  backend:
    build:
      context: ./cms-catalog-backend
      dockerfile: Dockerfile
    container_name: batik_backend  # <-- DIUBAH (sebelumnya cms_backend)
    env_file:
      - ./cms-catalog-backend/.env
    ports:
      - "3000:3000"
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: userbatik/company-profile-batik:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'   # Bikin miner gak bisa nyedot CPU
          memory: 512M
    container_name: batik_frontend # <-- DIUBAH (sebelumnya company-profile-frontend)
    env_file:
      - ./company-profile-batik/.env
    pull_policy: always
    depends_on:
      - backend

  cms:
    build:
      context: ./dashboard-cms
      dockerfile: Dockerfile
    container_name: batik_cms      # <-- DIUBAH (sebelumnya cms_app)
    env_file:
      - ./dashboard-cms/.env
    environment:
      - ESLINT_NO_DEV_ERRORS=true 
      - DISABLE_ESLINT_PLUGIN=true 
    ports:
      - "3002:3002"
    depends_on:
      - backend

  database:
    image: mysql:8.0
    container_name: batik_mysql    # <-- Boleh disamakan juga
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=cms_catalog_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"                  # <-- Jangan lupa expose port 443 jika pakai SSL!
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - /etc/nginx/certs:/etc/nginx/certs # <-- Mount certs SSL jika disimpan di host
    depends_on:
      - backend
      - frontend
      - cms

volumes:
  mysql_data:
  uploaded_files: